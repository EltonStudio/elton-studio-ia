<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELTON APK STUDIO</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0b0b0b;
color:white;
text-align:center;
}

header{
background:#00ffcc;
color:black;
padding:15px;
font-size:22px;
font-weight:bold;
}

.container{
padding:15px;
}

.login{
margin-top:80px;
}

input, textarea{
width:95%;
max-width:500px;
padding:12px;
margin:6px;
border-radius:8px;
border:none;
font-size:16px;
}

textarea{
height:220px;
}

button{
padding:14px;
margin:10px;
font-size:18px;
background:#00ffcc;
border:none;
border-radius:10px;
cursor:pointer;
}

button:hover{
background:#00e6b8;
}

.painel{
display:none;
}

.simulador{
margin-top:20px;
display:flex;
flex-direction:column;
align-items:center;
gap:25px;
}

.celular{
width:300px;
height:520px;
border:8px solid black;
border-radius:25px;
overflow:hidden;
background:white;
}

.pc{
width:95%;
max-width:600px;
height:300px;
border:8px solid black;
overflow:hidden;
background:white;
}

iframe{
width:100%;
height:100%;
border:none;
}

.info{
margin-top:10px;
font-size:14px;
opacity:0.8;
}

</style>
</head>

<body>

<header>
ELTON APK STUDIO
</header>

<div class="container">

<div class="login" id="login">

<h2>Área Protegida</h2>

<input type="password" id="senha" placeholder="Digite a senha">

<br>

<button onclick="entrar()">ENTRAR</button>

</div>

<div class="painel" id="painel">

<h2>Criar Aplicativo</h2>

<input id="nomeApp" placeholder="Nome do Aplicativo">

<input id="criador" placeholder="Nome do Criador">

<input id="versao" placeholder="Versão do App">

<p>Código do aplicativo</p>

<textarea id="codigo">

<h1 style="text-align:center;">Meu Primeiro App</h1>

<p style="text-align:center;">Criado no Elton APK Studio</p>

<button onclick="alert('App funcionando!')">
Testar botão
</button>

</textarea>

<br>

<button onclick="simular()">SIMULAR APP</button>

<div class="simulador">

<div>
<h3>Simulação Celular</h3>

<div class="celular">
<iframe id="previewMobile"></iframe>
</div>
</div>

<div>
<h3>Simulação Computador</h3>

<div class="pc">
<iframe id="previewPC"></iframe>
</div>
</div>

</div>

<p class="info">
Cole qualquer código HTML para testar o aplicativo
</p>

</div>

</div>

<script>

function entrar(){

let senha = document.getElementById("senha").value;

if(senha === "123456"){

document.getElementById("login").style.display="none";
document.getElementById("painel").style.display="block";

}else{

alert("Senha incorreta");

}

}

function simular(){

let codigo = document.getElementById("codigo").value;

let mobile = document.getElementById("previewMobile");
let pc = document.getElementById("previewPC");

mobile.srcdoc = codigo;
pc.srcdoc = codigo;

}

</script>

</body>
</html>
