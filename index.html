<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELTON STUDIO IA PRO | WORKSTATION</title>
    <style>
        :root { --metal: #2c2c2e; --lcd: #00ff41; --gold: #d4af37; }
        body { background: #111; color: white; font-family: 'Arial', sans-serif; margin: 0; display: flex; height: 100vh; }
        
        /* Menu Lateral de Navegação (Pastas) */
        .sidebar { width: 200px; background: #000; border-right: 2px solid #333; display: flex; flex-direction: column; padding: 10px; }
        .folder-btn { background: none; border: none; color: #aaa; text-align: left; padding: 15px; cursor: pointer; border-bottom: 1px solid #222; font-size: 13px; }
        .folder-btn:hover { color: var(--lcd); background: #1a1a1a; }

        /* Área de Trabalho do Software */
        .workspace { flex-grow: 1; background: var(--metal); padding: 20px; position: relative; overflow-y: auto; }
        .window { background: #1a1a1a; border: 2px solid #444; border-radius: 8px; box-shadow: 0 10px 30px #000; display: none; padding: 20px; }
        .window.active { display: block; }

        /* Design de Hardware do Mixer */
        .mixer-pro { display: flex; gap: 8px; background: #000; padding: 20px; border-radius: 10px; border: 4px solid #333; }
        .fader-slot { width: 40px; height: 250px; background: #111; border-radius: 5px; position: relative; }
        .fader-cap { width: 30px; height: 50px; background: #555; position: absolute; left: 5px; bottom: 50%; cursor: pointer; border-radius: 2px; border: 1px solid #777; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2 style="color: var(--gold); font-size: 14px; text-align: center;">ELTON STUDIO IA</h2>
    <button class="folder-btn" onclick="openTab('mixer')">📁 MIXER CONSOLE</button>
    <button class="folder-btn" onclick="openTab('teclas')">📁 ELTON TECLAS (MIDI)</button>
    <button class="folder-btn" onclick="openTab('tr-camelo')">📁 TR CAMELO GESTÃO</button>
    <button class="folder-btn" onclick="openTab('arquivos')">📁 EXPLORADOR DE SONS</button>
</div>

<div class="workspace">
    <div id="mixer" class="window active">
        <h3 style="color: var(--lcd);">MASTER MIXER - 16 CHANNELS</h3>
        <div class="mixer-pro" id="mixer-render"></div>
    </div>

    <div id="tr-camelo" class="window">
        <h3 style="color: var(--gold);">SISTEMA DE LOGÍSTICA TR CAMELO</h3>
        <div style="background: #000; padding: 15px; border-radius: 5px;">
            <p>Relatórios de Manutenção:</p>
            <input type="text" placeholder="Placa do Veículo" id="placa" style="background: #222; border: 1px solid #444; color: white; padding: 10px; width: 80%;">
            <button onclick="alert('Dados salvos na pasta /data/')" style="background: var(--gold); padding: 10px; margin-top: 10px; border: none; font-weight: bold;">SALVAR NO BANCO</button>
        </div>
    </div>
</div>

<script>
    // Gerar Canais do Estúdio Profissional
    const mixer = document.getElementById('mixer-render');
    for(let i=1; i<=16; i++) {
        mixer.innerHTML += `
            <div class="fader-slot">
                <span style="font-size: 10px; color: #555; position: absolute; top: -20px;">CH${i}</span>
                <div class="fader-cap" style="bottom: ${Math.random()*70}%"></div>
            </div>
        `;
    }

    // Função para navegar entre as pastas do sistema
    function openTab(id) {
        document.querySelectorAll('.window').forEach(w => w.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>

</body>
</html>
