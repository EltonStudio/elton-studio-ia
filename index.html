<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELTON APK STUDIO</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b0b;
    color: white;
    text-align: center;
}

header {
    background: #00ffcc;
    color: black;
    padding: 15px;
    font-size: 22px;
    font-weight: bold;
    box-shadow: 0px 4px 10px rgba(0, 255, 204, 0.3);
}

.container {
    padding: 15px;
}

.login {
    margin-top: 80px;
    background: #1a1a1a;
    padding: 30px;
    border-radius: 15px;
    display: inline-block;
    border: 1px solid #333;
}

input, textarea {
    width: 95%;
    max-width: 500px;
    padding: 12px;
    margin: 6px;
    border-radius: 8px;
    border: 1px solid #444;
    font-size: 16px;
    background: #222;
    color: white;
}

textarea {
    height: 220px;
    font-family: monospace;
}

button {
    padding: 14px 30px;
    margin: 10px;
    font-size: 18px;
    background: #00ffcc;
    color: black;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

button:hover {
    background: #00e6b8;
    transform: scale(1.05);
}

.painel {
    display: none;
}

.simulador {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 25px;
}

.celular {
    width: 300px;
    height: 520px;
    border: 12px solid #222;
    border-radius: 35px;
    overflow: hidden;
    background: white;
    box-shadow: 0px 10px 20px rgba(0,0,0,0.5);
}

.pc {
    width: 95%;
    max-width: 700px;
    height: 400px;
    border: 12px solid #222;
    border-radius: 10px;
    overflow: hidden;
    background: white;
    box-shadow: 0px 10px 20px rgba(0,0,0,0.5);
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
}

.info {
    margin-top: 20px;
    font-size: 14px;
    color: #00ffcc;
}
</style>
</head>

<body>

<header>
ELTON APK STUDIO
</header>

<div class="container">

    <div class="login" id="login">
        <h2>Área Protegida</h2>
        <p>Acesse o seu estúdio de criação</p>
        <input type="password" id="senha" placeholder="Digite a senha (120586)">
        <br>
        <button onclick="entrar()">ENTRAR NO SISTEMA</button>
    </div>

    <div class="painel" id="painel">
        <h2>Criar Aplicativo</h2>
        <input id="nomeApp" placeholder="Nome do Aplicativo">
        <input id="criador" placeholder="Nome do Criador">
        <input id="versao" placeholder="Versão do App" value="1.0.0">

        <p>Código HTML do seu Aplicativo</p>
        <textarea id="codigo">
<div style="text-align:center; padding:20px; font-family: sans-serif;">
    <h1 style="color:#007bff;">Meu Aplicativo Elton</h1>
    <p>Este app foi criado no Elton APK Studio.</p>
    <button style="padding:10px; background:green; color:white; border:none; border-radius:5px;" onclick="alert('Funciona!')">
        Testar Sistema
    </button>
</div>
        </textarea>

        <br>
        <button onclick="simular()">SIMULAR AGORA</button>

        <div class="simulador">
            <div>
                <h3>Visualização Mobile</h3>
                <div class="celular">
                    <iframe id="previewMobile"></iframe>
                </div>
            </div>

            <div>
                <h3>Visualização PC</h3>
                <div class="pc">
                    <iframe id="previewPC"></iframe>
                </div>
            </div>
        </div>

        <p class="info">
            Pronto para exportar seu APK? Cole o código e clique em simular.
        </p>
    </div>

</div>

<script>
function entrar() {
    // Pega o valor digitado
    const senhaDigitada = document.getElementById("senha").value;
    
    // VERIFICAÇÃO DA NOVA SENHA
    if (senhaDigitada === "120586") {
        document.getElementById("login").style.display = "none";
        document.getElementById("painel").style.display = "block";
    } else {
        alert("Senha incorreta! Tente novamente.");
        document.getElementById("senha").value = ""; // Limpa o campo
    }
}

function simular() {
    const conteudo = document.getElementById("codigo").value;
    const mobile = document.getElementById("previewMobile");
    const pc = document.getElementById("previewPC");

    // Aplica o código nos iframes
    mobile.srcdoc = conteudo;
    pc.srcdoc = conteudo;
}

// Permite apertar "Enter" para logar
document.getElementById("senha").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        entrar();
    }
});
</script>

</body>
</html>
