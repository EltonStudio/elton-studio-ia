<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELTON STUDIO IA & TR CAMELO</title>
    <style>
        :root { --blue: #007bff; --green: #28a745; --gold: #d4af37; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: sans-serif; text-align: center; margin: 0; }
        .box { background: #111; border: 1px solid #333; border-radius: 15px; padding: 15px; margin: 10px; }
        .mixer { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 15px 0; }
        .canal { background: #222; border: 1px solid #444; border-radius: 5px; padding: 10px 0; font-size: 10px; color: var(--blue); font-weight: bold; }
        .btn { background: var(--green); color: white; border: none; padding: 16px; width: 100%; border-radius: 12px; font-weight: bold; margin: 8px 0; cursor: pointer; }
        .btn-ia { background: var(--blue); }
        #teclado { display: none; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 15px; }
        .tecla { background: white; color: black; height: 120px; border-radius: 0 0 5px 5px; display: flex; align-items: flex-end; justify-content: center; font-weight: bold; padding-bottom: 10px; }
        #painel-elton { display: none; border: 2px solid var(--gold); padding: 15px; border-radius: 15px; background: #1a1a1a; }
    </style>
</head>
<body>
    <div style="padding: 15px;">
        <h1 style="color: var(--blue);">ELTON STUDIO IA</h1>
        <div class="box" style="border-color: var(--blue);">
            <h3>🎙️ MIXER 16 CANAIS & METRÔNOMO</h3>
            <button class="btn btn-ia" onclick="alert('IA: Sincronizando Metrônomo...')">⏱️ SINCRONIZAR IA</button>
            <div class="mixer">
                <div class="canal">CH 01</div><div class="canal">CH 02</div><div class="canal">CH 03</div><div class="canal">CH 04</div>
                <div class="canal">CH 05</div><div class="canal">CH 06</div><div class="canal">CH 07</div><div class="canal">CH 08</div>
                <div class="canal">CH 09</div><div class="canal">CH 10</div><div class="canal">CH 11</div><div class="canal">CH 12</div>
                <div class="canal">CH 13</div><div class="canal">CH 14</div><div class="canal">CH 15</div><div class="canal">CH 16</div>
            </div>
            <button class="btn" onclick="document.getElementById('teclado').style.display='grid'">🎹 ABRIR ELTON TECLAS</button>
            <div id="teclado">
                <div class="tecla">DÓ</div><div class="tecla">RÉ</div><div class="tecla">MÍ</div><div class="tecla">FÁ</div>
                <div class="tecla">SOL</div><div class="tecla">LÁ</div><div class="tecla">SÍ</div>
            </div>
        </div>
        <div class="box" style="border-color: var(--green);">
            <h3 style="color: var(--green);">🚛 TR CAMELO</h3>
            <button class="btn" onclick="alert('Ponto registrado!')">📅 BATER PONTO</button>
            <button class="btn" onclick="alert('Relatório enviado!')">🛠️ MANUTENÇÃO</button>
        </div>
        <button class="btn" style="background: #222; color: var(--gold); border: 1px solid var(--gold);" onclick="login()">🔑 ACESSO ELTON JONISON</button>
        <div id="painel-elton">
            <h2 style="color: var(--gold);">FINANCEIRO TR CAMELO</h2>
            <button class="btn" style="background: var(--gold); color: black;" onclick="alert('Saldo: R$ 25.800,00')">📊 VER LUCROS</button>
        </div>
    </div>
    <script>
        function login() {
            let n = prompt("Nome do Dono:");
            if(n && n.toUpperCase().trim() === "ELTON JONISON") document.getElementById('painel-elton').style.display = 'block';
        }
    </script>
</body>
</html>
